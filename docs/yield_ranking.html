<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>配当ランキング | Yield Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; font-family: 'Segoe UI', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif; }
    .beta-note { font-size: 0.9rem; color: #6c757d; }
    th, td { white-space: nowrap; vertical-align: middle; }
    .stock-name { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: bold; }
    .stock-name a { text-decoration: none; color: #198754; }
    .stock-name a:hover { text-decoration: underline; color: #146c43; }
    
    /* 共通ヘッダー用（index等と共通） */
    .navbar-brand { font-weight: 700; color: #198754; }
    
    #loading { position: fixed; top:0; left:0; right:0; bottom:0; background:rgba(255,255,255,0.9); z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  </style>
</head>
<body>

  <div id="loading">
    <div class="spinner-border text-success" role="status"></div>
    <div class="mt-3 text-success fw-bold">ランキングデータを集計中...</div>
  </div>

  <nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand d-flex align-items-center" href="index.html" style="font-size: 1.2rem;">Yield Map</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#yieldMapNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="yieldMapNavbar">
        <ul class="navbar-nav mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link text-success fw-bold" href="yield_ranking.html">配当ランキング</a></li>
          <li class="nav-item"><a class="nav-link text-secondary" href="search.html">銘柄検索</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container my-5" style="max-width: 1200px;">
    <h1 class="mb-3">配当ランキング</h1>
    <p class="beta-note">
      全上場企業の中から、総利回り（配当＋優待）が高い順に上位100銘柄をリアルタイムで抽出しています。
    </p>

    <div class="table-responsive mt-4 bg-white shadow-sm rounded">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th class="text-center">順位</th>
            <th>銘柄名</th>
            <th>コード</th>
            <th>業種</th>
            <th class="text-end">株価</th>
            <th class="text-end">総利回り</th>
            <th class="text-center">レッドカード</th>
          </tr>
        </thead>
        <tbody id="ranking-tbody">
          </tbody>
      </table>
    </div>

    <footer class="mt-5 text-center text-muted small pb-4">
      © Yield Map
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const response = await fetch('output/YieldMap_output.json');
        if (!response.ok) throw new Error("JSON読み込みエラー");
        const data = await response.json();

        // 1. データのフィルタリングとソート
        // 利回りが存在し、異常値(999)ではない銘柄を、利回り降順でソート
        const rankedData = data
          .filter(d => d.Total_Yield != null && d.Total_Yield !== 999 && d.Price > 0)
          .sort((a, b) => b.Total_Yield - a.Total_Yield)
          .slice(0, 100); // 描画負荷を下げるため上位100件に絞る

        // 2. テーブル行の生成
        const tbody = document.getElementById("ranking-tbody");
        let html = "";

        if (rankedData.length === 0) {
          html = '<tr><td colspan="7" class="text-center py-4 text-muted">データが見つかりません。</td></tr>';
        } else {
          rankedData.forEach((stock, index) => {
            // 順位メダルの装飾
            let rankStyle = "fw-bold text-secondary";
            if (index === 0) rankStyle = "fw-bold text-warning fs-5"; // 金
            if (index === 1) rankStyle = "fw-bold text-secondary fs-5"; // 銀
            if (index === 2) rankStyle = "fw-bold" style="color: #cd7f32; font-size: 1.1rem;"; // 銅
            
            // レッドカードバッジ
            const rcCount = stock.Red_Card_Count || 0;
            const rcBadge = rcCount > 0 
              ? `<span class="badge bg-danger rounded-pill">${rcCount}件</span>` 
              : `<span class="badge bg-light text-muted border">なし</span>`;

            html += `
              <tr>
                <td class="text-center ${rankStyle}">${index + 1}位</td>
                <td class="stock-name" title="${stock.Name}">
                  <a href="stock.html?code=${stock.code}">${stock.Name}</a>
                </td>
                <td><span class="text-muted small">${stock.code}</span></td>
                <td><span class="badge bg-light text-dark border">${stock.Industry || "一般"}</span></td>
                <td class="text-end fw-medium">${stock.Price.toLocaleString()}円</td>
                <td class="text-end fw-bold text-success">${stock.Total_Yield.toFixed(2)}%</td>
                <td class="text-center">${rcBadge}</td>
              </tr>
            `;
          });
        }

        tbody.innerHTML = html;
        document.getElementById("loading").style.display = "none";

      } catch (error) {
        console.error(error);
        document.getElementById("ranking-tbody").innerHTML = '<tr><td colspan="7" class="text-center py-4 text-danger">データの読み込みに失敗しました。</td></tr>';
        document.getElementById("loading").style.display = "none";
      }
    });
  </script>
</body>
</html>
