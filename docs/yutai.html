<!DOCTYPE html>
<html lang="ja">
<head>
  <title>株主優待 | Yield Map</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    /* Yield Map プロフェッショナル・テーマ */
    :root { --primary: #1e293b; --secondary: #3b82f6; --accent: #d97706; --bg-light: #f8fafc; --surface: #ffffff; --text-main: #0f172a; --text-sub: #64748b; --border-color: #e2e8f0; }
    body { background: var(--bg-light); color: var(--text-main); font-family: "Helvetica Neue", Arial, sans-serif; font-size: 16px; line-height: 1.6; }
    .card-base { background: var(--surface); border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); padding: 20px 24px; margin-bottom: 20px; transition: box-shadow 0.2s; }
    .card-base:hover { box-shadow: 0 10px 15px -3px rgba(0,0,0,0.08); }
    .page-header { font-size: 1.5rem; font-weight: 800; color: var(--primary); margin-bottom: 0; }
    .section-title { font-weight: 700; color: var(--primary); display: flex; align-items: center; }
    .section-title.yutai-main { margin-top: 40px; margin-bottom: 20px; font-size: 1.5rem; }
    .section-title.yutai-main::before { content: ""; display: inline-block; width: 6px; height: 24px; background-color: var(--accent); margin-right: 12px; border-radius: 3px; }
    .section-title.sub { margin-top: 40px; margin-bottom: 16px; font-size: 1.25rem; }
    .section-title.sub::before { content: ""; display: inline-block; width: 5px; height: 20px; background-color: var(--secondary); margin-right: 10px; border-radius: 3px; }
    
    .metric-card { height: 100%; background: var(--surface); border-radius: 16px; border: 1px solid var(--border-color); padding: 20px 16px; text-align: center; display: flex; flex-direction: column; justify-content: center; transition: transform 0.2s; }
    .metric-card:hover { transform: translateY(-2px); }
    .metric-card.primary { background: linear-gradient(145deg, #ffffff, #f0f9ff); border: 2px solid #bae6fd; }
    .bg-safe { background-color: #eff6ff !important; border: 2px solid #bfdbfe !important; }
    .bg-standard { background-color: #f0fdf4 !important; border: 2px solid #bbf7d0 !important; }
    .bg-danger { background-color: #fef8f8 !important; border: 2px solid #fecdd3 !important; }
    
    .metric-label { font-size: 1.05rem; font-weight: 700; color: #334155; margin-bottom: 10px; }
    .metric-value { font-size: 2.2rem; font-weight: 800; color: var(--primary); line-height: 1.1; font-family: monospace; }
    .metric-card.primary .metric-value { color: var(--secondary); font-size: 2.6rem; }
    .metric-sub { font-size: 0.8rem; color: #94a3b8; margin-top: 6px; }
    
    .metric-relative { display: inline-block; margin-top: 8px; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
    
    .star-rating { position: relative; display: inline-block; text-align: left; font-size: 1.6rem; color: rgba(0,0,0,0.08); line-height: 1; letter-spacing: 2px; margin: 8px auto; }
    .star-rating-front { position: absolute; top: 0; left: 0; overflow: hidden; white-space: nowrap; width: var(--rating-percent, 0%); }
    .color-safe .star-rating-front { color: #2563eb; }    
    .color-standard .star-rating-front { color: #10b981; }  
    .color-danger .star-rating-front { color: #e11d48; }  

    .metric-yutai-placeholder { height: 100px; border-radius: 8px; background: #f1f5f9; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; color: #94a3b8; }
    
    .table-custom-wrapper { border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid var(--border-color); background: var(--surface); }
    .table-custom { margin-bottom: 0; width: 100%; border-collapse: collapse; }
    .table-custom th, .table-custom td { white-space: nowrap; vertical-align: middle; }
    .table-custom thead th { background: var(--primary); color: #ffffff; font-weight: 600; font-size: 0.95rem; padding: 14px 16px; border: none; text-align: center; }
    .table-custom tbody td { padding: 16px; border-bottom: 1px solid var(--border-color); font-weight: 500; text-align: center; }
    .content-link { color: var(--secondary); text-decoration: none; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 6px 12px; border-radius: 8px; background: #eff6ff; transition: 0.2s; }
    .content-link:hover { background: #dbeafe; color: #1e40af; }
    
    .sim-container { background: #ffffff; border-radius: 16px; padding: 24px; border: 1px solid var(--border-color); }
    .sim-result { font-family: monospace; font-size: 1.5rem; font-weight: 700; color: var(--primary); }
    .sim-input-group { background: #f8fafc; border-radius: 12px; padding: 20px; border: 1px solid var(--border-color); }
    
    #loading { position: fixed; top:0; left:0; right:0; bottom:0; background:rgba(255,255,255,0.9); z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  </style>
</head>
<body>

<div id="loading">
  <div class="spinner-border text-success" role="status"></div>
  <div class="mt-3 text-success fw-bold">データを読み込み中...</div>
</div>

<div id="common-header"></div>

<div class="container-fluid mt-4 px-4" style="max-width:1400px; margin:auto;">

  <div class="d-flex align-items-center justify-content-between mb-4">
    <div>
      <a href="#" id="ui-back-link" class="text-decoration-none text-muted fw-bold" style="font-size: 0.9rem;">&larr; 銘柄詳細へ戻る</a>
      <h1 class="page-header mt-2">
        <span id="ui-company-name">企業名取得中</span> <span class="text-muted" style="font-size: 1.2rem; font-weight: 600;">(<span id="ui-code">----</span>)</span>
      </h1>
    </div>
  </div>

  <div class="row row-cols-2 row-cols-md-5 g-3 mb-5">
    <div class="col">
      <div class="metric-card">
        <div class="metric-label">優待イメージ</div>
        <div class="metric-yutai-placeholder">No Image</div>
      </div>
    </div>
    <div class="col">
      <div class="metric-card">
        <div class="metric-label">購入検討価格</div>
        <div class="d-flex align-items-center justify-content-center my-auto">
          <input type="number" id="ui-price-input" class="form-control fw-bold text-end px-2 bg-light" style="max-width: 120px; font-size: 1.2rem; color: var(--primary); border: 2px dashed #bae6fd; border-radius: 8px;" placeholder="入力">
          <span class="ms-1 fw-bold">円</span>
        </div>
        <div class="metric-sub mt-2 text-primary fw-bold"><i class="bi bi-info-circle"></i> 株価を入力して計算</div>
      </div>
    </div>
    <div class="col">
      <div class="metric-card primary">
        <div class="metric-label">総利回り</div>
        <div class="metric-value"><span id="ui-total-yield">—</span><span style="font-size: 1.2rem;">%</span></div>
        <div class="metric-sub">（配当＋優待）</div>
      </div>
    </div>
    
    <div class="col">
      <div class="metric-card" id="ui-safety-card">
        <div class="metric-label">安全性スコア</div>
        <div class="metric-value"><span id="ui-safety-score">—</span><span style="font-size: 1rem;">点</span></div>
        <div><span class="metric-relative" id="ui-safety-label">—</span></div>
      </div>
    </div>
    <div class="col">
      <div class="metric-card" id="ui-risk-card">
        <div class="metric-label">優待維持力</div>
        <div class="star-rating" id="ui-star-color" style="--rating-percent: 0%;" aria-label="星評価">
          <span aria-hidden="true">★★★★★</span>
          <div class="star-rating-front" aria-hidden="true">★★★★★</div>
        </div>
        <div class="metric-value" style="font-size: 1.6rem;"><span id="ui-m-score">0</span><span style="font-size: 1rem;">点 / 50</span></div>
        <div><span class="metric-relative" id="ui-risk-label">—</span></div>
      </div>
    </div>
  </div> 

  <div id="ui-yutai-area" style="display: none;">
    <h2 class="section-title yutai-main">株主優待の詳細</h2>
    <div class="table-custom-wrapper mb-5">
      <table class="table-custom">
        <thead>
          <tr>
            <th>優待の種別</th>
            <th>必要株数</th>
            <th>優待の価値（目安）</th>
            <th>詳しい内容</th>
          </tr>
        </thead>
        <tbody id="ui-yutai-tbody">
          </tbody>
      </table>
    </div>

    <div id="ui-modal-container"></div>

    <h2 class="section-title sub">投資シミュレーター</h2>
    <div class="sim-container mb-5">
      <div class="d-flex flex-column flex-md-row gap-4 p-4 mb-4" style="background: #f8fafc; border-radius: 12px; border: 1px solid var(--border-color);">
        <div class="flex-fill text-center text-md-start">
          <span class="text-muted d-block mb-1" style="font-size: 0.9rem;">年間優待価値換算</span>
          <span id="simValue" class="sim-result fs-2">— 円</span>
        </div>
        <div class="flex-fill border-md-start ps-md-4 text-center text-md-start">
          <span class="text-muted d-block mb-1" style="font-size: 0.9rem;">実質優待利回り</span>
          <span id="simYield" class="sim-result fs-2 text-secondary">— %</span>
        </div>
      </div>
      <div class="sim-input-group mb-0">
        <label class="form-label fw-bold text-muted mb-3">保有株数を設定</label>
        <div class="input-group mb-3" style="max-width: 250px;">
          <input type="text" inputmode="numeric" class="form-control fw-bold text-end" id="simSharesDisplay" style="font-size: 1.5rem; height: 50px;">
          <span class="input-group-text fw-bold" style="background: #e2e8f0; border: none;">株</span>
        </div>
        <input type="hidden" id="simSharesInput" value="100">
        <input type="range" class="form-range w-100" id="simShares" min="0" max="2000" value="100" step="100">
      </div>
      <div class="mt-4 pt-4" style="border-top: 1px solid var(--border-color);">
        <div class="text-muted small fw-bold mb-2">📊 利回りカーブ（株数 vs 優待利回り）</div>
        <div style="position: relative; height: 200px; width: 100%;">
          <canvas id="yutaiYieldChart"></canvas>
        </div>
      </div>
    </div> 
  </div>

  <div id="ui-no-yutai" class="card-base text-center text-muted py-5" style="display: none;">
    現在、この銘柄は株主優待を実施していません（またはデータがありません）。
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
let CURRENT_STOCK_PRICE = 0;
let YUTAI_RULES = []; 
let yutaiChart = null;

document.addEventListener("DOMContentLoaded", async () => {
  const urlParams = new URLSearchParams(window.location.search);
  const targetCode = urlParams.get('code');
  if (!targetCode) { window.location.href = "index.html"; return; }
  document.getElementById("ui-back-link").href = `stock.html?code=${targetCode}`;

  try {
    // 既存データとマニュアルデータを並列で取得
    const [response, manualResponse] = await Promise.all([
      fetch('output/YieldMap_output.json'),
      fetch('manual_yutai_master.json').catch(() => null)
    ]);
    
    const data = await response.json();
    const manualYutaiData = manualResponse ? await manualResponse.json() : null;

    const stock = data.find(d => String(d.code) === targetCode || String(d.edinetCode) === targetCode);
    if (!stock) throw new Error("銘柄データなし");

    // manual_yutai_master.jsonからデータを抽出して上書きするロジック
    if (manualYutaiData && manualYutaiData[targetCode]) {
      let raw = manualYutaiData[targetCode];
      
      // 不規則なJSON構造を正規化して対象データを特定
      if (Array.isArray(raw) && raw.length > 0) {
        raw = raw[0];
      }
      if (raw.benefits) {
        raw = raw.benefits;
      } else if (raw.shareholder_benefits) {
        raw = raw.shareholder_benefits;
      } else if (raw[targetCode]) {
        raw = raw[targetCode];
      }
      
      // エラーメッセージでない場合のみ処理を実行
      if (!raw.error) {
        const extracted = [];
        for (const key in raw) {
          if (key === 'code' || key === 'name') continue;
          
          // "1000株以上"などの文字列から数字のみを抽出
          const sharesMatch = key.match(/\d+/);
          if (sharesMatch) {
            const shares = parseInt(sharesMatch[0], 10);
            const value = Number(raw[key]);
            
            if (!isNaN(shares) && !isNaN(value)) {
              extracted.push({ shares, value });
            }
          }
        }
        
        // 抽出に成功した場合のみ上書き処理を行う
        if (extracted.length > 0) {
          // 株数の昇順にソート
          extracted.sort((a, b) => a.shares - b.shares);
          
          // 既存の優待詳細文(detail)を株数ごとにマッピングして保持
          const detailMap = {};
          if (stock.Yutai_Details && Array.isArray(stock.Yutai_Details)) {
            stock.Yutai_Details.forEach(d => {
              detailMap[d.shares] = d.detail;
            });
          }
          
          // 優待フラグとカテゴリを強制的に有効化
          stock.Has_Yutai = true;
          if (!stock.Yutai_Categories || stock.Yutai_Categories.length === 0) {
            stock.Yutai_Categories = ["優待"];
          }
          
          // 新しい株数・価値ルールでstock.Yutai_Detailsを上書き
          stock.Yutai_Details = extracted.map(rule => ({
            shares: rule.shares,
            value: rule.value,
            detail: detailMap[rule.shares] || '詳細データなし'
          }));
        }
      }
    }

    // 基本情報セット
    document.title = `${stock.Name}（${stock.code}）| 株主優待 | Yield Map`;
    document.getElementById("ui-company-name").textContent = stock.Name;
    document.getElementById("ui-code").textContent = stock.code;
    
    CURRENT_STOCK_PRICE = 0; // API価格への依存を排除
    window._stockDivPerShare = stock.DividendsPaid_PerShare || 0; // 総利回り計算用に保持
    
    const priceInput = document.getElementById("ui-price-input");
    priceInput.value = ""; // 空欄スタート

    // 入力状況に応じてフォームの見た目を変えるイベントリスナーを追加
    priceInput.addEventListener("input", (e) => {
      if (e.target.value) {
        e.target.classList.remove("bg-light");
        e.target.style.borderStyle = "solid";
      } else {
        e.target.classList.add("bg-light");
        e.target.style.borderStyle = "dashed";
      }
    });
    
    // スコア処理
    document.getElementById("ui-safety-score").textContent = (stock['⭐⭐⭐YieldMap_総合スコア'] !== null && stock['⭐⭐⭐YieldMap_総合スコア'] !== undefined) ? stock['⭐⭐⭐YieldMap_総合スコア'].toFixed(1) : "—";
    const mScore = stock.Yutai_Maintenance_Score || 25; 
    document.getElementById("ui-m-score").textContent = mScore;
    document.getElementById("ui-star-color").style.setProperty('--rating-percent', `${(mScore/50)*100}%`);
    document.getElementById("ui-star-color").classList.add(mScore >= 40 ? 'color-safe' : (mScore >= 25 ? 'color-standard' : 'color-danger'));

    // 本物データとの結合ロジック
    if (stock.Has_Yutai && stock.Yutai_Categories && stock.Yutai_Details && stock.Yutai_Details.length > 0) {
      document.getElementById("ui-yutai-area").style.display = "block";
      
      let tbodyHtml = "";
      let modalHtml = "";
      
      YUTAI_RULES = stock.Yutai_Details.map(rule => ({
        shares: rule.shares,
        annualValue: rule.value,
        detail: rule.detail
      }));

      // 🌟 株数ごとのテーブル行とモーダルを動的に生成（価値列を追加）
      stock.Yutai_Details.forEach((rule, index) => {
        
        // 価値が0（空欄や「180USD」などの計算不能な文字）の場合は「算定不可 / 割引等」と表示
        const valueText = rule.value > 0 ? `${rule.value.toLocaleString()} 円相当` : '<span class="badge bg-secondary opacity-75 fw-normal">算定不可 / 割引等</span>';
        
        tbodyHtml += `
          <tr>
            <td><span class="badge bg-light text-dark border px-2 py-1">${stock.Yutai_Categories.join(', ')}</span></td>
            <td><strong style="font-size: 1.2rem; color: var(--primary);">${rule.shares}</strong> 株</td>
            <td class="fw-bold" style="color: var(--accent); font-size: 1.1rem;">${valueText}</td>
            <td><span class="content-link" data-bs-toggle="modal" data-bs-target="#yutaiModal${index}">詳細を見る <i class="bi bi-box-arrow-up-right ms-1"></i></span></td>
          </tr>`;
        
        const detailText = rule.detail ? rule.detail : '詳細データなし';

        modalHtml += `
          <div class="modal fade" id="yutaiModal${index}" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
              <div class="modal-content" style="border-radius: 16px;">
                <div class="modal-header border-0 pb-0">
                  <h5 class="modal-title fw-bold text-dark">🎁 優待内容の詳細 <span class="badge bg-primary ms-2">${rule.shares}株</span></h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4 pt-3">
                  <div class="p-3 bg-light rounded mb-3 border">
                    <p class="mb-0 fw-bold" style="color: var(--accent); font-size: 1.2rem;">${valueText}</p>
                  </div>
                  <strong class="text-secondary d-block mb-2"><i class="bi bi-card-text me-1"></i> 優待の詳しい条件・内容</strong>
                  <p class="mb-0 text-dark" style="line-height: 1.7; font-size: 0.95rem;">${detailText}</p>
                </div>
              </div>
            </div>
          </div>`;
      });
      
      document.getElementById("ui-yutai-tbody").innerHTML = tbodyHtml;
      document.getElementById("ui-modal-container").innerHTML = modalHtml;
      
      initSimulator();
    } else {
      document.getElementById("ui-no-yutai").style.display = "block";
    }

    document.getElementById("loading").style.display = "none";
  } catch (err) {
    console.error(err);
    alert("読み込みエラー");
    document.getElementById("loading").style.display = "none";
  }
});

function initSimulator() {
  const MAX_SHARES = 2000;
  const slider = document.getElementById("simShares");
  const displayInput = document.getElementById("simSharesDisplay");
  const priceInput = document.getElementById("ui-price-input");

  function getAnnualYutaiValue(shares) {
    let v = 0;
    for (const r of YUTAI_RULES) { 
        if (shares >= r.shares) v = Math.max(v, r.annualValue); 
    }
    return v;
  }

  function updateTotalYield() {
      const dps = window._stockDivPerShare || 0;
      const divYield = CURRENT_STOCK_PRICE > 0 ? (dps / CURRENT_STOCK_PRICE) * 100 : 0;
      const minShares = YUTAI_RULES.length > 0 ? YUTAI_RULES[0].shares : 100;
      const yutaiVal = getAnnualYutaiValue(minShares);
      const yutaiYield = CURRENT_STOCK_PRICE > 0 ? (yutaiVal / (CURRENT_STOCK_PRICE * minShares)) * 100 : 0;
      
      const total = divYield + yutaiYield;
      document.getElementById("ui-total-yield").textContent = CURRENT_STOCK_PRICE > 0 && total > 0 ? total.toFixed(2) : "—";
  }

  function updateSimCalc(shares) {
    const value = getAnnualYutaiValue(shares);
    document.getElementById("simValue").textContent = value > 0 ? value.toLocaleString() + " 円" : "— 円";
    
    const inv = CURRENT_STOCK_PRICE * shares;
    const yieldPct = inv > 0 ? (value / inv) * 100 : 0;
    document.getElementById("simYield").textContent = CURRENT_STOCK_PRICE > 0 && yieldPct > 0 ? yieldPct.toFixed(2) + " %" : "— %";
    
    if (yutaiChart) { 
        yutaiChart.data.datasets[1].data = [{ x: shares, y: yieldPct }]; 
        yutaiChart.update("none"); 
    }
  }

  function updateChartCurve() {
      if (!yutaiChart) return;
      const newChartData = Array.from({length: (MAX_SHARES/100) + 1}, (_, i) => i * 100).map(s => {
        if (s === 0) return null;
        const v = getAnnualYutaiValue(s);
        const inv = CURRENT_STOCK_PRICE * s;
        return inv > 0 ? {x: s, y: +(v/inv*100).toFixed(5)} : null;
      }).filter(Boolean);
      
      yutaiChart.data.datasets[0].data = newChartData;
      
      const currentShares = parseInt(slider.value, 10) || 100;
      const v = getAnnualYutaiValue(currentShares);
      const yieldPct = (CURRENT_STOCK_PRICE * currentShares) > 0 ? (v / (CURRENT_STOCK_PRICE * currentShares)) * 100 : 0;
      yutaiChart.data.datasets[1].data = [{ x: currentShares, y: yieldPct }];
      
      yutaiChart.update("none");
  }
  
  const updateShares = (val) => {
    let shares = Number(val) || 0;
    shares = Math.round(shares / 100) * 100;
    slider.value = shares;
    displayInput.value = shares.toLocaleString("ja-JP");
    updateSimCalc(shares);
  };

  slider.addEventListener("input", e => updateShares(e.target.value));
  displayInput.addEventListener("blur", e => updateShares(e.target.value.replace(/[^\d]/g, "")));

  priceInput.addEventListener("input", (e) => {
      const val = parseFloat(e.target.value);
      if (!isNaN(val) && val > 0) {
          CURRENT_STOCK_PRICE = val;
      } else {
          CURRENT_STOCK_PRICE = 0; // 空欄や0以下の場合はリセットする
      }
      updateSimCalc(parseInt(slider.value, 10));
      updateChartCurve();
      updateTotalYield();
  });

  const ctx = document.getElementById("yutaiYieldChart").getContext("2d");
  
  const chartData = Array.from({length: (MAX_SHARES/100) + 1}, (_, i) => i * 100).map(s => {
    if (s === 0) return null;
    const v = getAnnualYutaiValue(s);
    const inv = CURRENT_STOCK_PRICE * s;
    return inv > 0 ? {x: s, y: +(v/inv*100).toFixed(5)} : null;
  }).filter(Boolean);

  yutaiChart = new Chart(ctx, {
    type: "line",
    data: {
      datasets: [
        { label: "優待利回り", data: chartData, tension: 0.15, borderColor: "#3b82f6", backgroundColor: "rgba(59, 130, 246, 0.1)", fill: true },
        { label: "現在位置", data: [], pointRadius: 8, pointBackgroundColor: "#d97706", showLine: false }
      ]
    },
    options: { 
        responsive: true, 
        maintainAspectRatio: false, 
        scales: { 
            x: { type: "linear", min: 0, max: MAX_SHARES, title: { display: true, text: '保有株数' } },
            y: { title: { display: true, text: '優待利回り (%)' } }
        },
        plugins: {
            tooltip: {
                callbacks: {
                    label: function(context) {
                        return `${context.parsed.x}株: 利回り ${context.parsed.y.toFixed(2)}%`;
                    }
                }
            }
        }
    }
  });

  const initialShares = YUTAI_RULES.length > 0 ? YUTAI_RULES[0].shares : 100;
  updateShares(initialShares);
  updateTotalYield();
}
</script>
<script src="header.js"></script>
</body>
</html>
