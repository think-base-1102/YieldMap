<!DOCTYPE html>
<html lang="ja">
<head>
  <title>配当情報 | Yield Map</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --primary: #1f3a5f; --secondary: #4a6fa5; --accent: #3b82f6; --bg-light: #f4f6f8; --text-main: #1a1a1a; --text-sub: #6b7280; }
    body { background: var(--bg-light); color: var(--text-main); font-size: 16px; line-height: 1.7; }
    .card-base { background: #fff; border-radius: 14px; border: 1px solid #e5e7eb; padding: 16px 18px; }
    .section-title.dividend-main { margin-top: 36px; margin-bottom: 18px; font-size: 1.65rem; font-weight: 800; border-left: 7px solid var(--accent); padding-left: 14px; background: linear-gradient(to right, #eff6ff, transparent); }
    .section-title.sub { margin-top: 44px; margin-bottom: 14px; font-size: 1.35rem; font-weight: 700; border-left: 6px solid var(--secondary); padding-left: 12px; }
    .section-title.light { margin-top: 56px; margin-bottom: 10px; font-size: 1.15rem; font-weight: 600; border-left: 4px solid #d1d5db; padding-left: 10px; color: var(--text-sub); }
    .metric-card { height: 100%; background: #fff; border-radius: 14px; border: 1px solid #e5e7eb; padding: 18px 16px; text-align: center; }
    .metric-card.primary { background: linear-gradient(135deg, #eff6ff, #e0ecff); border: 2px solid var(--accent); }
    .metric-label { font-size: 1rem; color: var(--text-sub); }
    .metric-value { font-size: 2.6rem; font-weight: 700; color: var(--primary); line-height: 1.1; }
    .metric-sub { font-size: 0.85rem; color: #9ca3af; }
    table th { background: #f1f5f9; font-weight: 600; white-space: nowrap; }
    table td { vertical-align: middle; }
    .dividend-highlight { background: #eff6ff; font-weight: 700; border-left: 4px solid var(--accent); }
    .memo-area { width: 100%; min-height: 140px; border-radius: 10px; border: 1px solid #e5e7eb; padding: 12px; font-size: 0.9rem; background: #fafafa; color: var(--text-sub); }
    /* SPA用ローディング表示 */
    #loading { position: fixed; top:0; left:0; right:0; bottom:0; background:rgba(255,255,255,0.9); z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  </style>
</head>
<body class="pb-5">

<div id="loading">
  <div class="spinner-border text-primary" role="status"></div>
  <div class="mt-3 text-primary fw-bold">データを読み込み中...</div>
</div>

<nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-bold text-success d-flex align-items-center" href="index.html" style="font-size: 1.2rem;">Yield Map</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#yieldMapNavbar">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse justify-content-end" id="yieldMapNavbar">
      <ul class="navbar-nav mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link text-secondary" href="yield_ranking.html">配当ランキング</a></li>
        <li class="nav-item"><a class="nav-link text-secondary" href="search.html">銘柄検索</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container-fluid mt-4 px-3" style="max-width:1100px; margin:auto;">

  <div class="mb-3 d-flex justify-content-between align-items-center">
    <h1 class="h5 fw-bold mb-0">
      <span id="ui-company-name">企業名取得中</span>（<span id="ui-code">----</span>）
    </h1>
    <a href="#" id="ui-back-link" class="text-decoration-none btn btn-outline-secondary btn-sm">← 詳細へ戻る</a>
  </div>

  <div class="row g-3 mb-4">
    <div class="col-6 col-md-3">
      <div class="metric-card">
        <div class="metric-label">株価</div>
        <div class="metric-value"><span id="ui-price">—</span><span style="font-size:1rem;">円</span></div>
        <div class="metric-sub">更新日：<span id="ui-latest-date">—</span></div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="metric-card primary">
        <div class="metric-label">配当利回り</div>
        <div class="metric-value"><span id="ui-yield">—</span><span style="font-size:1rem;">%</span></div>
        <div class="metric-sub">予想ベース</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="metric-card">
        <div class="metric-label">年間配当</div>
        <div class="metric-value"><span id="ui-dividend">—</span><span style="font-size:1rem;">円</span></div>
        <div class="metric-sub">1株あたり</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="metric-card">
        <div class="metric-label">配当性向</div>
        <div class="metric-value"><span id="ui-payout">—</span><span style="font-size:1rem;">%</span></div>
        <div class="metric-sub">直近決算</div>
      </div>
    </div>
  </div>

  <div class="section-title dividend-main">配当履歴</div>
  
  <div id="ui-history-container">
     <div class="card-base text-center text-muted py-4">
       詳細な配当履歴データは現在準備中（またはJSON未収録）です。
     </div>
  </div>

  <div class="section-title light">メモ (ブラウザに保存されます)</div>
  <textarea class="memo-area" id="ui-memo" placeholder="この銘柄に関するメモを入力できます..."></textarea>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {
  const urlParams = new URLSearchParams(window.location.search);
  const targetCode = urlParams.get('code');

  if (!targetCode) {
    alert("銘柄コードが指定されていません。");
    window.location.href = "index.html";
    return;
  }

  // 「戻る」リンクの設定
  document.getElementById("ui-back-link").href = `stock.html?code=${targetCode}`;

  try {
    const response = await fetch('output/YieldMap_output.json');
    if (!response.ok) throw new Error("JSON読み込みエラー");
    const data = await response.json();

    const stock = data.find(d => String(d.code) === targetCode || String(d.edinetCode) === targetCode);
    
    if (!stock) {
      alert("該当データが見つかりません。");
      window.location.href = "index.html";
      return;
    }

    // データ反映
    document.title = `${stock.Name}（${stock.code}）| 配当 | Yield Map`;
    document.getElementById("ui-company-name").textContent = stock.Name;
    document.getElementById("ui-code").textContent = stock.code;
    
    // JSONから確実な基準日を読み取る
    document.getElementById("ui-latest-date").textContent = stock.Market_Date || "日付不明";
    
    const fmt = (val, dec=1) => (val !== null && val !== undefined && val !== 999) ? Number(val).toFixed(dec) : "—";
    
    document.getElementById("ui-price").textContent = fmt(stock.Price, 0);
    
    // 【修正箇所】Total_Yieldではなく、純粋な配当利回りを読み込む
    document.getElementById("ui-yield").textContent = fmt(stock.Dividend_Yield, 2);
    
    // 配当額と配当性向の安全な読み込み
    document.getElementById("ui-dividend").textContent = stock.DividendsPaid_PerShare ? fmt(stock.DividendsPaid_PerShare, 1) : "—"; 
    document.getElementById("ui-payout").textContent = stock.Payout_Ratio ? fmt(stock.Payout_Ratio, 1) : "—";

    // メモ機能（LocalStorageを使用）
    const memoKey = `memo_${targetCode}`;
    const memoArea = document.getElementById("ui-memo");
    memoArea.value = localStorage.getItem(memoKey) || "";
    memoArea.addEventListener("input", (e) => {
       localStorage.setItem(memoKey, e.target.value);
    });

    document.getElementById("loading").style.display = "none";

  } catch (err) {
    console.error(err);
    alert("データの読み込みに失敗しました。");
    document.getElementById("loading").style.display = "none";
  }
});
</script>
</body>
</html>
