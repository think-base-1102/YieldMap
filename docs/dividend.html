<!DOCTYPE html>
<html lang="ja">
<head>
  <title>配当情報 | Yield Map</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    :root { --primary: #1f3a5f; --secondary: #4a6fa5; --accent: #3b82f6; --bg-light: #f4f6f8; --text-main: #1a1a1a; --text-sub: #6b7280; }
    /* 💡 修正: 固定ヘッダーの高さ分(76px)の余白を上部に追加 */
    body { background: var(--bg-light); color: var(--text-main); font-size: 16px; line-height: 1.7; padding-top: 76px; }
    .card-base { background: #fff; border-radius: 14px; border: 1px solid #e5e7eb; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .section-title.dividend-main { margin-top: 36px; margin-bottom: 18px; font-size: 1.65rem; font-weight: 800; border-left: 7px solid var(--accent); padding-left: 14px; background: linear-gradient(to right, #eff6ff, transparent); }
    .section-title.light { margin-top: 56px; margin-bottom: 10px; font-size: 1.15rem; font-weight: 600; border-left: 4px solid #d1d5db; padding-left: 10px; color: var(--text-sub); }
    
    .metric-card { height: 100%; background: #fff; border-radius: 14px; border: 1px solid #e5e7eb; padding: 18px 16px; text-align: center; }
    .metric-card.primary { background: linear-gradient(135deg, #eff6ff, #e0ecff); border: 2px solid var(--accent); }
    .metric-label { font-size: 1rem; color: var(--text-sub); font-weight: 600; }
    .metric-value { font-size: 2.4rem; font-weight: 800; color: var(--primary); line-height: 1.2; font-family: monospace; }
    .metric-sub { font-size: 0.85rem; color: #9ca3af; }
    
    .memo-area { width: 100%; min-height: 140px; border-radius: 10px; border: 1px solid #e5e7eb; padding: 12px; font-size: 0.95rem; background: #fafafa; color: var(--text-sub); }
    .memo-area:focus { outline: none; border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
    
    #loading { position: fixed; top:0; left:0; right:0; bottom:0; background:rgba(255,255,255,0.9); z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; }
    
    .chart-container { position: relative; height: 350px; width: 100%; }
    .status-badge { font-size: 0.85rem; padding: 6px 12px; border-radius: 20px; font-weight: bold; }
    .status-up { background-color: #d1fae5; color: #059669; border: 1px solid #a7f3d0; }
    .status-keep { background-color: #f3f4f6; color: #4b5563; border: 1px solid #e5e7eb; }
    .status-down { background-color: #fee2e2; color: #e11d48; border: 1px solid #fecdd3; }
  </style>
</head>
<body class="pb-5">

<div id="loading">
  <div class="spinner-border text-primary" role="status"></div>
  <div class="mt-3 text-primary fw-bold">データを読み込み中...</div>
</div>

<div id="common-header"></div>

<div class="container-fluid mt-4 px-4" style="max-width:1100px; margin:auto;">

  <div class="mb-4 d-flex justify-content-between align-items-end">
    <div>
      <h1 class="h4 fw-bold mb-1" style="color: var(--primary);">
        <span id="ui-company-name">企業名取得中</span> <span class="text-muted fs-5">(<span id="ui-code">----</span>)</span>
      </h1>
      <span class="badge bg-light text-secondary border"><span id="ui-industry">業種</span></span>
      <!-- 💡 株主優待バッジ（JSで表示制御・有無のみ） -->
      <span id="ui-yutai-badge" class="badge bg-white text-danger border border-danger ms-1" style="display: none;"><i class="bi bi-gift-fill me-1"></i>株主優待あり</span>
      <!-- 💡 修正: エラーの原因となっていた日付表示用のHTML要素（ui-latest-date）を追加 -->
      <span class="text-muted small ms-2 fw-bold"><i class="bi bi-calendar-check"></i> <span id="ui-latest-date">—</span></span>
    </div>
    <a href="#" id="ui-back-link" class="text-decoration-none btn btn-outline-secondary btn-sm fw-bold">&larr; 銘柄詳細へ戻る</a>
  </div>

  <!-- 💡 危険シグナル警告エリア（JSで表示制御） -->
  <div id="ui-alert-area" class="mb-4" style="display: none;"></div>

  <!-- 💡 AI総合評価＆スコア -->
  <div id="ui-ai-comment-area" class="card-base mb-4" style="background: linear-gradient(to right, #f8f9fa, #ffffff); display: none;">
    <div class="d-flex align-items-center mb-2">
      <span class="badge bg-primary me-2 px-3 py-2" style="font-size: 1.05rem;">YieldMap 総合スコア: <span id="ui-yieldmap-score" class="fw-bold fs-5">--</span>点</span>
    </div>
    <p id="ui-ai-comment" class="mb-0 text-dark fw-bold" style="white-space: pre-wrap; line-height: 1.6;"></p>
  </div>

  <div class="row g-3 mb-5">
    <div class="col-6 col-md-3">
      <div class="metric-card">
        <div class="metric-label d-flex align-items-center justify-content-center">1株あたり純資産 (BPS) <i class="bi bi-question-circle-fill text-muted ms-1 term-icon" style="cursor: pointer; font-size: 0.9rem;" onclick="event.preventDefault();" data-term-title="1株あたり純資産 (BPS)" data-term-desc="会社が解散した場合に、株主1株あたりに戻ってくる価値の目安です。<br><br><span class='text-primary fw-bold'>💡 配当投資での活用法：</span><br>株価がこの数値を下回っている（PBR1倍割れ）と、底値が固い「割安な配当株」として狙い目になる傾向があります。"></i></div>
        <div class="metric-value"><span id="ui-theo-bps">—</span><span style="font-size:1rem;">円</span></div>
        <div class="metric-sub">解散価値の目安</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="metric-card primary">
        <div class="metric-label d-flex align-items-center justify-content-center">1株配当金 <i class="bi bi-question-circle-fill text-muted ms-1 term-icon" style="cursor: pointer; font-size: 0.9rem;" onclick="event.preventDefault();" data-term-title="1株あたり配当金" data-term-desc="会社が稼いだ利益の中から、株主に対して「1株あたりいくら現金を配るか」を示す金額です。<br><br><span class='text-primary fw-bold'>💡 配当推移の見方：</span><br>下のグラフでこの金額が右肩上がりになっている企業は、業績が順調に伸びており、株主への還元意欲も高い優良企業と言えます。"></i></div>
        <div class="metric-value"><span id="ui-dividend">—</span><span style="font-size:1.2rem;">円</span></div>
        <div class="metric-sub">年間配当実績</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div id="ui-payout-card" class="metric-card" style="transition: all 0.3s ease;">
        <div class="metric-label d-flex align-items-center justify-content-center">配当性向 <i class="bi bi-question-circle-fill text-muted ms-1 term-icon" style="cursor: pointer; font-size: 0.9rem;" onclick="event.preventDefault();" data-term-title="配当性向" data-term-desc="会社が1年間で稼いだ利益のうち、「何%を配当金として株主に配ったか」を示す割合です。<br><br><span class='text-primary fw-bold'>💡 減配リスクの目安：</span><br>・<b>30%〜50%</b>：健全な水準（余裕あり）<br>・<b>80%以上</b>：利益をほぼ全額吐き出しており、少しでも業績が落ちれば減配（配当が減る）リスクが極めて高い危険な状態です。"></i></div>
        <div class="metric-value"><span id="ui-payout">—</span><span style="font-size:1rem;">%</span></div>
        <div class="metric-sub">利益からどれだけ還元したか</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="metric-card">
        <div class="metric-label d-flex align-items-center justify-content-center">連続増配記録 <i class="bi bi-question-circle-fill text-muted ms-1 term-icon" style="cursor: pointer; font-size: 0.9rem;" onclick="event.preventDefault();" data-term-title="連続増配記録" data-term-desc="毎年、配当金を増やし続けている年数です。<br><br><span class='text-primary fw-bold'>💡 なぜ重要か？：</span><br>長年連続で増配している企業は、不況時でも安定して利益を出せる強固なビジネスモデルの証明です。持ち続けるだけで受け取れる配当金が増えていくため、長期投資の最強の味方になります。"></i></div>
        <div class="metric-value"><span id="ui-div-growth">—</span><span style="font-size:1.2rem;">年</span></div>
        <div class="metric-sub">過去の推移より解析</div>
      </div>
    </div>
  </div>

  <div class="section-title dividend-main">1株配当金の推移（過去5年間）</div>
  <div class="card-base mb-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h5 class="fw-bold mb-1">配当実績のトラッキング</h5>
        <p class="text-muted small mb-0" id="ui-history-summary">データ解析中...</p>
      </div>
      <div id="ui-trend-badge" style="display: none;"></div>
    </div>
    
    <div class="chart-container">
      <canvas id="dividendChart"></canvas>
    </div>
    
    <div id="ui-no-history" class="text-center py-5 text-muted" style="display: none;">
      <i class="bi bi-clock-history fs-1 d-block mb-3 opacity-50"></i>
      過去の配当履歴データがありません（または無配です）
    </div>
  </div>

  <div class="section-title light d-flex justify-content-between align-items-center mt-5 mb-3">
    <span><i class="bi bi-cloud-check me-1 text-primary"></i> クラウド投資ノート</span>
    <span id="ui-memo-status" class="badge bg-secondary" style="font-size: 0.75rem; font-weight: normal;"><i class="bi bi-cloud-arrow-down me-1"></i>未ログイン</span>
  </div>
  <textarea class="memo-area shadow-sm" id="ui-memo" placeholder="ログインしてメモを保存（端末間で自動同期されます）" disabled style="background-color: #f1f3f5; cursor: not-allowed;"></textarea>

  <!-- 💡 共通フッターのコンテナ -->
  <div id="common-footer"></div>
</div>

<!-- 💡 用語解説用 コンポーネント (モバイル用: Offcanvas / PC用: Modal) -->
<div class="offcanvas offcanvas-bottom d-md-none" tabindex="-1" id="termOffcanvas" aria-labelledby="termOffcanvasLabel" style="border-top-left-radius: 16px; border-top-right-radius: 16px; z-index: 1050; transition: transform 0.3s ease-in-out, height 0.3s ease-in-out;">
  <div class="d-flex justify-content-center pt-2 pb-1 d-md-none" style="touch-action: none;">
    <div style="width: 40px; height: 5px; background-color: #dee2e6; border-radius: 10px;"></div>
  </div>
  <div class="offcanvas-header border-bottom py-2" id="termOffcanvasHeader" style="touch-action: none;">
    <h5 class="offcanvas-title fw-bold text-dark d-flex align-items-center" id="termOffcanvasLabel">
      <i class="bi bi-info-circle-fill text-primary me-2"></i><span class="ui-term-title">解説</span>
    </h5>
    <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>
  <div class="offcanvas-body pb-4" id="termOffcanvasBody" style="font-size: 0.95rem; line-height: 1.6; color: #495057; overflow-y: auto;">
    <p class="mb-0 ui-term-desc">解説がここに入ります。</p>
  </div>
</div>

<div class="modal fade d-none d-md-block" id="termModal" tabindex="-1" aria-labelledby="termModalLabel" aria-hidden="true" style="z-index: 1050;">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="border-radius: 16px;">
      <div class="modal-header border-bottom py-3">
        <h5 class="modal-title fw-bold text-dark d-flex align-items-center" id="termModalLabel">
          <i class="bi bi-info-circle-fill text-primary me-2"></i><span class="ui-term-title">解説</span>
        </h5>
        <button type="button" class="btn-close text-reset" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body pb-4" style="font-size: 0.95rem; line-height: 1.6; color: #495057;">
        <p class="mb-0 ui-term-desc">解説がここに入ります。</p>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="utils.js"></script>
<script src="footer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {
  const urlParams = new URLSearchParams(window.location.search);
  const targetCode = urlParams.get('code');

  if (!targetCode) {
    window.location.href = "index.html";
    return;
  }

  document.getElementById("ui-back-link").href = `stock.html?code=${targetCode}`;

  try {
    const response = await fetch('output/YieldMap_output.json');
    if (!response.ok) throw new Error("JSON読み込みエラー");
    const data = await response.json();

    // 💡 手動マスター（連続増配期数）のJSONを非同期で取得し、グローバルにセット
    try {
      const manualRes = await fetch('output/manual_consecutive_years.json');
      if (manualRes.ok) {
        window.manualConsecutiveYears = await manualRes.json();
      } else {
        window.manualConsecutiveYears = {};
      }
    } catch (e) {
      window.manualConsecutiveYears = {};
    }

    const stock = data.find(d => String(d.code) === targetCode);
    if (!stock) {
      document.getElementById("loading").style.display = "none";
      const container = document.querySelector(".container-fluid");
      container.innerHTML = `
        <div class="d-flex flex-column justify-content-center align-items-center py-5 mt-5">
          <i class="bi bi-exclamation-triangle-fill text-danger mb-3" style="font-size: 4rem;"></i>
          <h2 class="fw-bold mb-3">銘柄データが見つかりません</h2>
          <p class="text-muted mb-4">指定された銘柄コード（${targetCode}）のデータが存在しないか、読み込めませんでした。</p>
          <a href="index.html" class="btn btn-primary px-4 py-2 rounded-pill fw-bold">
            <i class="bi bi-house-door-fill me-2"></i>トップページへ戻る
          </a>
        </div>
      `;
      return;
    }

    // 1. 基本データの反映
    document.title = `${stock.Name}（${stock.code}）| 配当推移 | Yield Map`;
    document.getElementById("ui-company-name").textContent = stock.Name;
    document.getElementById("ui-code").textContent = stock.code;
    document.getElementById("ui-industry").textContent = stock.Industry || "一般";
    document.getElementById("ui-latest-date").textContent = stock.Market_Date || "日付不明";
    
    // 💡 株主優待バッジの表示制御（有無のみ）
    if (stock.Has_Yutai) {
      document.getElementById("ui-yutai-badge").style.display = "inline-block";
    }

    // 💡 AIコメントと総合スコアの反映
    const scoreVal = stock["⭐⭐⭐YieldMap_総合スコア"];
    const aiComment = stock.AI_Comment;
    if (scoreVal !== undefined || aiComment) {
      document.getElementById("ui-ai-comment-area").style.display = "block";
      document.getElementById("ui-yieldmap-score").textContent = scoreVal !== undefined ? Number(scoreVal).toFixed(1) : "—";
      document.getElementById("ui-ai-comment").textContent = aiComment || "";
    }
    
    // 💡 修正: null等の欠損値に加えて、NaN評価も弾く堅牢なフォーマット関数
    const fmt = (val, dec=1) => (val !== null && val !== undefined && val !== 999 && val !== "" && !Number.isNaN(Number(val))) ? Number(val).toFixed(dec) : "—";
    
    document.getElementById("ui-theo-bps").textContent = fmt(stock.Theoretical_Price_BPS, 0);
    document.getElementById("ui-dividend").textContent = fmt(stock.DividendsPaid_PerShare, 1); 
    
    // 💡 配当性向の反映と視覚的警告
    const payoutStr = fmt(stock.Payout_Ratio, 1);
    document.getElementById("ui-payout").textContent = payoutStr;
    if (payoutStr !== "—") {
      const payoutVal = Number(stock.Payout_Ratio);
      const payoutCard = document.getElementById("ui-payout-card");
      const payoutText = document.getElementById("ui-payout");
      if (payoutVal >= 100) {
        payoutCard.style.backgroundColor = "#fff0f0";
        payoutCard.style.borderColor = "#ffcdd2";
        payoutText.style.color = "#e11d48";
      } else if (payoutVal >= 80) {
        payoutCard.style.backgroundColor = "#fffbeb";
        payoutCard.style.borderColor = "#fde68a";
        payoutText.style.color = "#d97706";
      }
    }

    // 💡 危険シグナルの可視化アラート
    const redFlags = stock.Red_Card_Flags ? String(stock.Red_Card_Flags).split('、').filter(f => f.trim() !== '') : [];
    if (redFlags.length > 0) {
      const alertArea = document.getElementById("ui-alert-area");
      const isDangerous = redFlags.some(f => f.includes('減配') || f.includes('タコ足'));
      const alertClass = isDangerous ? "alert-danger" : "alert-warning";
      const iconClass = isDangerous ? "bi-exclamation-octagon-fill" : "bi-exclamation-triangle-fill";
      
      let html = `<div class="alert ${alertClass} d-flex align-items-center shadow-sm" role="alert" style="border-radius: 12px; border-left: 6px solid ${isDangerous ? '#e11d48' : '#f59e0b'};">
                    <i class="bi ${iconClass} fs-4 me-3"></i>
                    <div>
                      <h6 class="alert-heading fw-bold mb-1">注意：財務・配当に関する警告シグナル</h6>
                      <ul class="mb-0 ps-3 small">`;
      redFlags.forEach(flag => {
        html += `<li>${flag}</li>`;
      });
      html += `      </ul>
                    </div>
                  </div>`;
      alertArea.innerHTML = html;
      alertArea.style.display = "block";
    }

    // 💡 修正: 連続増配計算より前に文字列の判定とパースを行う
    let historyData = stock.Dividend_History || [];
    if (typeof historyData === 'string') {
      try {
        historyData = JSON.parse(historyData);
      } catch (err) {
        historyData = [];
      }
    }

    // 💡 連続増配年数の計算 (utils.jsの共通関数を使用)
    const consecYears = getConsecutiveYears(historyData, stock.DividendsPaid_PerShare, stock.code);
    document.getElementById("ui-div-growth").textContent = consecYears > 0 ? consecYears : "—";

    // 2. メモ機能（Firebaseによるクラウド同期）
    const memoArea = document.getElementById("ui-memo");
    const memoStatus = document.getElementById("ui-memo-status");
    let saveTimeout;
    
    // ダイナミックインポートでFirebase管理モジュールを読み込み
    import('./firebase-manager.js').then(module => {
      const { auth, onAuthStateChanged, getMemo, saveMemo } = module;
      
      onAuthStateChanged(auth, async (user) => {
        if (user) {
          // ログイン状態：入力を許可し、サーバーからデータを取得
          memoArea.disabled = false;
          memoArea.style.backgroundColor = "#fafafa";
          memoArea.style.cursor = "text";
          memoArea.placeholder = "例：〇〇ショックの時でも減配しなかった。安定感あり。";
          memoStatus.innerHTML = `<div class="spinner-border spinner-border-sm" role="status"></div> 読み込み中...`;
          
          try {
            const savedMemo = await getMemo(user.uid, targetCode);
            memoArea.value = savedMemo || "";
            memoStatus.innerHTML = `<i class="bi bi-cloud-check-fill me-1"></i>同期完了`;
            memoStatus.className = "badge bg-success";
          } catch (e) {
            memoStatus.innerHTML = `<i class="bi bi-exclamation-triangle-fill me-1"></i>読み込み失敗`;
            memoStatus.className = "badge bg-danger";
          }
          
          // 入力時の自動同期（デバウンス処理：入力が止まってから1秒後に保存）
          memoArea.addEventListener("input", (e) => {
            memoStatus.innerHTML = `<i class="bi bi-arrow-repeat me-1"></i>同期中...`;
            memoStatus.className = "badge bg-warning text-dark";
            
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(async () => {
              try {
                await saveMemo(user.uid, targetCode, e.target.value);
                memoStatus.innerHTML = `<i class="bi bi-cloud-check-fill me-1"></i>同期完了`;
                memoStatus.className = "badge bg-success";
              } catch (err) {
                console.error("メモ保存エラー:", err);
                memoStatus.innerHTML = `<i class="bi bi-exclamation-triangle-fill me-1"></i>保存失敗`;
                memoStatus.className = "badge bg-danger";
              }
            }, 1000);
          });
        } else {
          // 未ログイン状態：入力をブロック
          memoArea.disabled = true;
          memoArea.value = "";
          memoArea.style.backgroundColor = "#f1f3f5";
          memoArea.style.cursor = "not-allowed";
          memoArea.placeholder = "ログインするとクラウド連携メモが利用できます。";
          memoStatus.innerHTML = `<i class="bi bi-cloud-slash me-1"></i>未ログイン`;
          memoStatus.className = "badge bg-secondary";
        }
      });
    }).catch(err => {
      console.error("Firebaseモジュールの読み込みに失敗:", err);
      memoStatus.textContent = "連携システムエラー";
      memoStatus.className = "badge bg-danger";
    });

    // 3. 🎯 過去配当履歴（Chart.js描画）
    try {
      if (Array.isArray(historyData) && historyData.length > 0) {
        // 💡 グラフ用に古い順（昇順）に並び替え
        historyData.sort((a, b) => parseInt(a.year, 10) - parseInt(b.year, 10));

        const labels = [];
        const values = [];

        const startYear = parseInt(historyData[0].year, 10);
        const endYear = parseInt(historyData[historyData.length - 1].year, 10);
        
        // 💡 欠落している年を検知し、0円として補完して連続したX軸を作る
        for (let y = startYear; y <= endYear; y++) {
          labels.push(y + "年");
          const foundData = historyData.find(d => parseInt(d.year, 10) === y);
          values.push(foundData ? foundData.dividend : 0);
        }
        
        // 直近の傾向を判定（増配か減配か）
        if (values.length >= 2) {
          const current = values[values.length - 1];
          const previous = values[values.length - 2];
          const badgeEl = document.getElementById("ui-trend-badge");
          badgeEl.style.display = "block";
          
          if (current > previous) {
            badgeEl.innerHTML = `<span class="status-badge status-up"><i class="bi bi-arrow-up-right-circle-fill me-1"></i> 前年比 増配 (${((current/previous - 1)*100).toFixed(1)}%)</span>`;
          } else if (current < previous) {
            badgeEl.innerHTML = `<span class="status-badge status-down"><i class="bi bi-arrow-down-right-circle-fill me-1"></i> 前年比 減配</span>`;
          } else {
            badgeEl.innerHTML = `<span class="status-badge status-keep"><i class="bi bi-dash-circle-fill me-1"></i> 配当維持</span>`;
          }
        }
        
        document.getElementById("ui-history-summary").textContent = `取得可能データ：過去 ${historyData.length} 年分 (EDINETより抽出)`;

        // グラフの描画
        const ctx = document.getElementById('dividendChart').getContext('2d');
        new Chart(ctx, {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [{
              label: '1株あたり配当金 (円)',
              data: values,
              backgroundColor: '#3b82f6',
              borderRadius: 6, // 棒の角を丸くする
              barPercentage: 0.6
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                backgroundColor: 'rgba(15, 23, 42, 0.9)',
                titleFont: { size: 14 },
                bodyFont: { size: 16, weight: 'bold' },
                padding: 12,
                displayColors: false,
                callbacks: {
                  label: function(context) {
                    return context.parsed.y.toLocaleString() + ' 円';
                  }
                }
              }
            },
            scales: {
              y: {
                beginAtZero: true,
                grid: { color: '#f1f5f9' },
                ticks: { font: { size: 12, weight: 'bold' }, color: '#64748b' }
              },
              x: {
                grid: { display: false },
                ticks: { font: { size: 12 }, color: '#64748b' }
              }
            },
            animation: {
              duration: 1200,
              easing: 'easeOutQuart'
            }
          }
        });
      } else {
        // データがない場合
        document.getElementById("dividendChart").style.display = "none";
        document.getElementById("ui-no-history").style.display = "block";
      }
    } catch (e) {
      console.error("グラフ描画エラー:", e);
      document.getElementById("dividendChart").style.display = "none";
      document.getElementById("ui-no-history").style.display = "block";
      document.getElementById("ui-no-history").innerHTML = "履歴データの解析に失敗しました。";
    }

    // 💡 用語解説コンポーネント（PC: Modal / モバイル: Offcanvas）の初期化とイベント設定
    const termIcons = document.querySelectorAll('.term-icon');
    if (termIcons.length > 0 && typeof bootstrap !== 'undefined') {
      const termOffcanvasEl = document.getElementById('termOffcanvas');
      const termModalEl = document.getElementById('termModal');
      const bsOffcanvas = new bootstrap.Offcanvas(termOffcanvasEl);
      const bsModal = new bootstrap.Modal(termModalEl);

      const titleEls = document.querySelectorAll('.ui-term-title');
      const descEls = document.querySelectorAll('.ui-term-desc');

      const headerEl = document.getElementById('termOffcanvasHeader');
      let startY = 0;
      let currentHeight = 0;
      let isDragging = false;
      const initialMobileHeight = 40; 
      const expandedMobileHeight = 85;

      const resetHeight = () => {
        termOffcanvasEl.style.height = `${initialMobileHeight}vh`;
      };
      
      termOffcanvasEl.addEventListener('show.bs.offcanvas', resetHeight);

      const handleTouchStart = (e) => {
        if (window.innerWidth >= 768) return; 
        startY = e.touches[0].clientY;
        currentHeight = termOffcanvasEl.getBoundingClientRect().height;
        isDragging = true;
        termOffcanvasEl.style.transition = 'none';
      };

      const handleTouchMove = (e) => {
        if (!isDragging) return;
        const deltaY = startY - e.touches[0].clientY; 
        const vh = ((currentHeight + deltaY) / window.innerHeight) * 100;
        
        if (vh >= initialMobileHeight && vh <= expandedMobileHeight) {
          termOffcanvasEl.style.height = `${vh}vh`;
          e.preventDefault();
        }
      };

      const handleTouchEnd = () => {
        if (!isDragging) return;
        isDragging = false;
        termOffcanvasEl.style.transition = 'transform 0.3s ease-in-out, height 0.3s ease-in-out';
        
        const finalVh = (termOffcanvasEl.getBoundingClientRect().height / window.innerHeight) * 100;
        if (finalVh > initialMobileHeight + 10) {
          termOffcanvasEl.style.height = `${expandedMobileHeight}vh`;
        } else {
          termOffcanvasEl.style.height = `${initialMobileHeight}vh`;
        }
      };

      if (headerEl) {
        headerEl.addEventListener('touchstart', handleTouchStart, { passive: false });
        headerEl.addEventListener('touchmove', handleTouchMove, { passive: false });
        headerEl.addEventListener('touchend', handleTouchEnd);
      }

      termIcons.forEach(icon => {
        icon.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          
          const titleText = icon.getAttribute('data-term-title') || "解説";
          const descHtml = icon.getAttribute('data-term-desc') || "";
          
          titleEls.forEach(el => el.textContent = titleText);
          descEls.forEach(el => el.innerHTML = descHtml);

          // 画面幅に応じて表示コンポーネントを切り替え
          if (window.innerWidth >= 768) {
            bsModal.show();
          } else {
            bsOffcanvas.show();
          }
        });
      });
    }

    document.getElementById("loading").style.display = "none";

  } catch (err) {
    console.error("システムエラー:", err);
    document.getElementById("loading").style.display = "none";
    const container = document.querySelector(".container-fluid");
    if (container) {
      container.innerHTML = `
        <div class="d-flex flex-column justify-content-center align-items-center py-5 mt-5">
          <i class="bi bi-x-octagon-fill text-danger mb-3" style="font-size: 4rem;"></i>
          <h2 class="fw-bold mb-3">システムエラー</h2>
          <p class="text-muted mb-4">データの読み込み中にエラーが発生しました。（${err.message}）</p>
          <a href="index.html" class="btn btn-outline-secondary px-4 py-2 rounded-pill fw-bold">
            <i class="bi bi-house-door-fill me-2"></i>トップページへ戻る
          </a>
        </div>
      `;
    }
  }
});
</script>
<script src="header.js"></script>
</body>
</html>
