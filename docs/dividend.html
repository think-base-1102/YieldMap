<!DOCTYPE html>
<html lang="ja">
<head>
  <title>配当情報 | Yield Map</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    :root { --primary: #1f3a5f; --secondary: #4a6fa5; --accent: #3b82f6; --bg-light: #f4f6f8; --text-main: #1a1a1a; --text-sub: #6b7280; }
    /* 💡 修正: 固定ヘッダーの高さ分(76px)の余白を上部に追加 */
    body { background: var(--bg-light); color: var(--text-main); font-size: 16px; line-height: 1.7; padding-top: 76px; }
    .card-base { background: #fff; border-radius: 14px; border: 1px solid #e5e7eb; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .section-title.dividend-main { margin-top: 36px; margin-bottom: 18px; font-size: 1.65rem; font-weight: 800; border-left: 7px solid var(--accent); padding-left: 14px; background: linear-gradient(to right, #eff6ff, transparent); }
    .section-title.light { margin-top: 56px; margin-bottom: 10px; font-size: 1.15rem; font-weight: 600; border-left: 4px solid #d1d5db; padding-left: 10px; color: var(--text-sub); }
    
    .metric-card { height: 100%; background: #fff; border-radius: 14px; border: 1px solid #e5e7eb; padding: 18px 16px; text-align: center; }
    .metric-card.primary { background: linear-gradient(135deg, #eff6ff, #e0ecff); border: 2px solid var(--accent); }
    .metric-label { font-size: 1rem; color: var(--text-sub); font-weight: 600; }
    .metric-value { font-size: 2.4rem; font-weight: 800; color: var(--primary); line-height: 1.2; font-family: monospace; }
    .metric-sub { font-size: 0.85rem; color: #9ca3af; }
    
    .memo-area { width: 100%; min-height: 140px; border-radius: 10px; border: 1px solid #e5e7eb; padding: 12px; font-size: 0.95rem; background: #fafafa; color: var(--text-sub); }
    .memo-area:focus { outline: none; border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
    
    #loading { position: fixed; top:0; left:0; right:0; bottom:0; background:rgba(255,255,255,0.9); z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; }
    
    .chart-container { position: relative; height: 350px; width: 100%; }
    .status-badge { font-size: 0.85rem; padding: 6px 12px; border-radius: 20px; font-weight: bold; }
    .status-up { background-color: #d1fae5; color: #059669; border: 1px solid #a7f3d0; }
    .status-keep { background-color: #f3f4f6; color: #4b5563; border: 1px solid #e5e7eb; }
    .status-down { background-color: #fee2e2; color: #e11d48; border: 1px solid #fecdd3; }
  </style>
</head>
<body class="pb-5">

<div id="loading">
  <div class="spinner-border text-primary" role="status"></div>
  <div class="mt-3 text-primary fw-bold">データを読み込み中...</div>
</div>

<div id="common-header"></div>

<div class="container-fluid mt-4 px-4" style="max-width:1100px; margin:auto;">

  <div class="mb-4 d-flex justify-content-between align-items-end">
    <div>
      <h1 class="h4 fw-bold mb-1" style="color: var(--primary);">
        <span id="ui-company-name">企業名取得中</span> <span class="text-muted fs-5">(<span id="ui-code">----</span>)</span>
      </h1>
      <span class="badge bg-light text-secondary border"><span id="ui-industry">業種</span></span>
      <!-- 💡 修正: エラーの原因となっていた日付表示用のHTML要素（ui-latest-date）を追加 -->
      <span class="text-muted small ms-2 fw-bold"><i class="bi bi-calendar-check"></i> <span id="ui-latest-date">—</span></span>
    </div>
    <a href="#" id="ui-back-link" class="text-decoration-none btn btn-outline-secondary btn-sm fw-bold">&larr; 銘柄詳細へ戻る</a>
  </div>

  <div class="row g-3 mb-5">
    <div class="col-6 col-md-3">
      <div class="metric-card">
        <div class="metric-label d-flex align-items-center justify-content-center">理論株価 (BPS) <i class="bi bi-question-circle-fill text-muted ms-1 term-icon" style="cursor: pointer; font-size: 0.9rem;" onclick="event.preventDefault();" data-term-title="理論株価 (BPS)" data-term-desc="会社が解散した場合に、株主1株あたりに戻ってくる価値の目安です。<br><br><span class='text-primary fw-bold'>💡 配当投資での活用法：</span><br>株価がこの数値を下回っている（PBR1倍割れ）と、底値が固い「割安な配当株」として狙い目になる傾向があります。"></i></div>
        <div class="metric-value"><span id="ui-theo-bps">—</span><span style="font-size:1rem;">円</span></div>
        <div class="metric-sub">1株あたり純資産</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="metric-card primary">
        <div class="metric-label d-flex align-items-center justify-content-center">1株配当金 <i class="bi bi-question-circle-fill text-muted ms-1 term-icon" style="cursor: pointer; font-size: 0.9rem;" onclick="event.preventDefault();" data-term-title="1株あたり配当金" data-term-desc="会社が稼いだ利益の中から、株主に対して「1株あたりいくら現金を配るか」を示す金額です。<br><br><span class='text-primary fw-bold'>💡 配当推移の見方：</span><br>下のグラフでこの金額が右肩上がりになっている企業は、業績が順調に伸びており、株主への還元意欲も高い優良企業と言えます。"></i></div>
        <div class="metric-value"><span id="ui-dividend">—</span><span style="font-size:1.2rem;">円</span></div>
        <div class="metric-sub">年間配当実績</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="metric-card">
        <div class="metric-label d-flex align-items-center justify-content-center">配当性向 <i class="bi bi-question-circle-fill text-muted ms-1 term-icon" style="cursor: pointer; font-size: 0.9rem;" onclick="event.preventDefault();" data-term-title="配当性向" data-term-desc="会社が1年間で稼いだ利益のうち、「何%を配当金として株主に配ったか」を示す割合です。<br><br><span class='text-primary fw-bold'>💡 減配リスクの目安：</span><br>・<b>30%〜50%</b>：健全な水準（余裕あり）<br>・<b>80%以上</b>：利益をほぼ全額吐き出しており、少しでも業績が落ちれば減配（配当が減る）リスクが極めて高い危険な状態です。"></i></div>
        <div class="metric-value"><span id="ui-payout">—</span><span style="font-size:1rem;">%</span></div>
        <div class="metric-sub">利益からどれだけ還元したか</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="metric-card">
        <div class="metric-label d-flex align-items-center justify-content-center">連続増配記録 <i class="bi bi-question-circle-fill text-muted ms-1 term-icon" style="cursor: pointer; font-size: 0.9rem;" onclick="event.preventDefault();" data-term-title="連続増配記録" data-term-desc="毎年、配当金を増やし続けている年数です。<br><br><span class='text-primary fw-bold'>💡 なぜ重要か？：</span><br>長年連続で増配している企業は、不況時でも安定して利益を出せる強固なビジネスモデルの証明です。持ち続けるだけで受け取れる配当金が増えていくため、長期投資の最強の味方になります。"></i></div>
        <div class="metric-value"><span id="ui-div-growth">—</span><span style="font-size:1.2rem;">年</span></div>
        <div class="metric-sub">過去の推移より解析</div>
      </div>
    </div>
  </div>

  <div class="section-title dividend-main">1株配当金の推移（過去5年間）</div>
  <div class="card-base mb-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h5 class="fw-bold mb-1">配当実績のトラッキング</h5>
        <p class="text-muted small mb-0" id="ui-history-summary">データ解析中...</p>
      </div>
      <div id="ui-trend-badge" style="display: none;"></div>
    </div>
    
    <div class="chart-container">
      <canvas id="dividendChart"></canvas>
    </div>
    
    <div id="ui-no-history" class="text-center py-5 text-muted" style="display: none;">
      <i class="bi bi-clock-history fs-1 d-block mb-3 opacity-50"></i>
      過去の配当履歴データがありません（または無配です）
    </div>
  </div>

  <div class="section-title light"><i class="bi bi-journal-text me-1"></i> 投資ノート (ブラウザ保存)</div>
  <textarea class="memo-area shadow-sm" id="ui-memo" placeholder="例：〇〇ショックの時でも減配しなかった。安定感あり。"></textarea>

  <!-- 💡 共通フッターのコンテナ -->
  <div id="common-footer"></div>
</div>

<!-- 💡 用語解説用 ボトムシート (Offcanvas) -->
<div class="offcanvas offcanvas-bottom" tabindex="-1" id="termOffcanvas" aria-labelledby="termOffcanvasLabel" style="height: auto; border-top-left-radius: 16px; border-top-right-radius: 16px; z-index: 1050;">
  <div class="offcanvas-header border-bottom py-3">
      <h5 class="offcanvas-title fw-bold text-dark d-flex align-items-center" id="termOffcanvasLabel">
        <i class="bi bi-info-circle-fill text-primary me-2"></i><span id="termOffcanvasTitle">解説</span>
      </h5>
      <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
  <div class="offcanvas-body pb-4" style="font-size: 0.95rem; line-height: 1.6; color: #495057;">
    <p id="termOffcanvasDesc" class="mb-0">解説がここに入ります。</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="utils.js"></script>
<script src="footer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {
  const urlParams = new URLSearchParams(window.location.search);
  const targetCode = urlParams.get('code');

  if (!targetCode) {
    window.location.href = "index.html";
    return;
  }

  document.getElementById("ui-back-link").href = `stock.html?code=${targetCode}`;

  try {
    const response = await fetch('output/YieldMap_output.json');
    if (!response.ok) throw new Error("JSON読み込みエラー");
    const data = await response.json();

    // 💡 手動マスター（連続増配期数）のJSONを非同期で取得し、グローバルにセット
    try {
      const manualRes = await fetch('output/manual_consecutive_years.json');
      if (manualRes.ok) {
        window.manualConsecutiveYears = await manualRes.json();
      } else {
        window.manualConsecutiveYears = {};
      }
    } catch (e) {
      window.manualConsecutiveYears = {};
    }

    const stock = data.find(d => String(d.code) === targetCode);
    if (!stock) {
      alert("該当データが見つかりません。");
      window.location.href = "index.html";
      return;
    }

    // 1. 基本データの反映
    document.title = `${stock.Name}（${stock.code}）| 配当推移 | Yield Map`;
    document.getElementById("ui-company-name").textContent = stock.Name;
    document.getElementById("ui-code").textContent = stock.code;
    document.getElementById("ui-industry").textContent = stock.Industry || "一般";
    document.getElementById("ui-latest-date").textContent = stock.Market_Date || "日付不明";
    
    const fmt = (val, dec=1) => (val !== null && val !== undefined && val !== 999 && val !== "") ? Number(val).toFixed(dec) : "—";
    
    document.getElementById("ui-theo-bps").textContent = fmt(stock.Theoretical_Price_BPS, 0);
    document.getElementById("ui-dividend").textContent = fmt(stock.DividendsPaid_PerShare, 1); 
    document.getElementById("ui-payout").textContent = fmt(stock.Payout_Ratio, 1);

    // 💡 修正: 連続増配計算より前に文字列の判定とパースを行う
    let historyData = stock.Dividend_History || [];
    if (typeof historyData === 'string') {
      try {
        historyData = JSON.parse(historyData);
      } catch (err) {
        historyData = [];
      }
    }

    // 💡 連続増配年数の計算 (utils.jsの共通関数を使用)
    const consecYears = getConsecutiveYears(historyData, stock.DividendsPaid_PerShare, stock.code);
    document.getElementById("ui-div-growth").textContent = consecYears > 0 ? consecYears : "—";

    // 2. メモ機能（LocalStorage）
    const memoKey = `memo_${targetCode}`;
    const memoArea = document.getElementById("ui-memo");
    memoArea.value = localStorage.getItem(memoKey) || "";
    memoArea.addEventListener("input", (e) => localStorage.setItem(memoKey, e.target.value));

    // 3. 🎯 過去配当履歴（Chart.js描画）
    try {
      if (Array.isArray(historyData) && historyData.length > 0) {
        // 新しい順になっているので、グラフ用に古い順に並び替え
        historyData.reverse();

        const labels = historyData.map(d => d.year + "年");
        const values = historyData.map(d => d.dividend);
        
        // 直近の傾向を判定（増配か減配か）
        if (values.length >= 2) {
          const current = values[values.length - 1];
          const previous = values[values.length - 2];
          const badgeEl = document.getElementById("ui-trend-badge");
          badgeEl.style.display = "block";
          
          if (current > previous) {
            badgeEl.innerHTML = `<span class="status-badge status-up"><i class="bi bi-arrow-up-right-circle-fill me-1"></i> 前年比 増配 (${((current/previous - 1)*100).toFixed(1)}%)</span>`;
          } else if (current < previous) {
            badgeEl.innerHTML = `<span class="status-badge status-down"><i class="bi bi-arrow-down-right-circle-fill me-1"></i> 前年比 減配</span>`;
          } else {
            badgeEl.innerHTML = `<span class="status-badge status-keep"><i class="bi bi-dash-circle-fill me-1"></i> 配当維持</span>`;
          }
        }
        
        document.getElementById("ui-history-summary").textContent = `取得可能データ：過去 ${historyData.length} 年分 (EDINETより抽出)`;

        // グラフの描画
        const ctx = document.getElementById('dividendChart').getContext('2d');
        new Chart(ctx, {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [{
              label: '1株あたり配当金 (円)',
              data: values,
              backgroundColor: '#3b82f6',
              borderRadius: 6, // 棒の角を丸くする
              barPercentage: 0.6
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                backgroundColor: 'rgba(15, 23, 42, 0.9)',
                titleFont: { size: 14 },
                bodyFont: { size: 16, weight: 'bold' },
                padding: 12,
                displayColors: false,
                callbacks: {
                  label: function(context) {
                    return context.parsed.y.toLocaleString() + ' 円';
                  }
                }
              }
            },
            scales: {
              y: {
                beginAtZero: true,
                grid: { color: '#f1f5f9' },
                ticks: { font: { size: 12, weight: 'bold' }, color: '#64748b' }
              },
              x: {
                grid: { display: false },
                ticks: { font: { size: 12 }, color: '#64748b' }
              }
            },
            animation: {
              duration: 1200,
              easing: 'easeOutQuart'
            }
          }
        });
      } else {
        // データがない場合
        document.getElementById("dividendChart").style.display = "none";
        document.getElementById("ui-no-history").style.display = "block";
      }
    } catch (e) {
      console.error("グラフ描画エラー:", e);
      document.getElementById("dividendChart").style.display = "none";
      document.getElementById("ui-no-history").style.display = "block";
      document.getElementById("ui-no-history").innerHTML = "履歴データの解析に失敗しました。";
    }

    // 💡 用語解説ボトムシート（Offcanvas）の初期化とイベント設定
    const termIcons = document.querySelectorAll('.term-icon');
    if (termIcons.length > 0) {
      const termOffcanvasEl = document.getElementById('termOffcanvas');
      if (termOffcanvasEl && typeof bootstrap !== 'undefined') {
        const bsOffcanvas = new bootstrap.Offcanvas(termOffcanvasEl);
        const titleEl = document.getElementById('termOffcanvasTitle');
        const descEl = document.getElementById('termOffcanvasDesc');

        termIcons.forEach(icon => {
          icon.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            titleEl.textContent = icon.getAttribute('data-term-title') || "解説";
            descEl.innerHTML = icon.getAttribute('data-term-desc') || "";
            bsOffcanvas.show();
          });
        });
      }
    }

    document.getElementById("loading").style.display = "none";

  } catch (err) {
    console.error(err);
    alert("データの読み込みに失敗しました。");
    document.getElementById("loading").style.display = "none";
  }
});
</script>
<script src="header.js"></script>
</body>
</html>
